name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Add The Hall of Ages 🃏
        run: |
          if ls _games/hall-of-ages.zip.part* >/dev/null 2>&1; then
            cat _games/hall-of-ages.zip.part* > /tmp/hall-of-ages.zip
            mkdir -p _site/hall-of-ages
            unzip -q -o /tmp/hall-of-ages.zip -d _site/hall-of-ages
            touch _site/.nojekyll
            # 小修补（下次重新打包时已包含，这里会自动跳过）
            G=_site/hall-of-ages
            sed -i 's#<title>无名杀</title>#<title>群星议会 The Hall of Ages</title>#' $G/index.html
            sed -i 's/init: "init",/init: "off",/' $G/noname/library/index.js
            if ! grep -q "showChangeLog = function" $G/character/qunxing.js; then
              sed -i 's#^window.QX = { lib, game, ui, get, ai, _status };$#&\nlib.config.new_tutorial = true;\ngame.showChangeLog = function() {};\ndocument.title = "群星议会 The Hall of Ages";#' $G/character/qunxing.js
            fi
            # 用另一个会话做好的版本（自带规则引擎和界面），不再用无名杀
            if [ -f _games/qx-play.html ]; then
              cp _games/qx-play.html $G/index.html
              sed -i "s#'qunxing-cards/qunxing-cards/'#'qxa/'#" $G/index.html
            fi
          fi
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
