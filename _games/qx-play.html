<script>
/* 群星议会 The Hall of Ages — 规则引擎 qx-engine.js
 * 事件 + 时机栈。所有结算流程都是 generator：需要玩家决定时 yield 一个请求对象，
 * 驱动器（AI / 界面 / 测试）把答案通过 gen.next(answer) 送回。
 * 只参考三国杀通行规则思路，不含任何第三方代码。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.QXEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const OPT_CANCEL = { optCancel: true };   // 可选技能在第一个选择里取消
  // ───────────────────────── 基础常量 ─────────────────────────
  const SUITS = ['spade', 'heart', 'club', 'diamond'];
  const SUIT_COLOR = { spade: 'black', club: 'black', heart: 'red', diamond: 'red', none: 'none' };
  const PHASES = ['prepare', 'judge', 'draw', 'play', 'discard', 'finish'];
  const ROLESETS = {
    5: ['chancellor', 'keeper', 'insurgent', 'insurgent', 'schemer'],
    8: ['chancellor', 'keeper', 'keeper', 'insurgent', 'insurgent', 'insurgent', 'insurgent', 'schemer'],
  };
  const CARD_DEFS = {};   // 牌名 → 定义（由 qx-cards.js 注册）
  const SKILLS = {};      // 技能 id → 定义（由武将文件注册）
  const HEROES = {};      // 武将 key → 定义

  class GameOver { constructor(winners, reason) { this.qxGameOver = true; this.winners = winners; this.reason = reason; } }

  function rng(seed) { // mulberry32
    let a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ───────────────────────── 牌 ─────────────────────────
  class Card {
    constructor(id, name, suit, rank) { this.id = id; this.name = name; this.suit = suit; this.rank = rank; this.loc = null; }
    get color() { return SUIT_COLOR[this.suit]; }
    get def() { return CARD_DEFS[this.name]; }
    get virtual() { return false; }
    get subcards() { return [this]; }
  }
  // 虚拟牌：转化牌 / 视为使用的牌。subcards 为实体牌（可为空）
  function virtualCard(name, subcards, extra) {
    subcards = subcards || [];
    let suit = 'none', rank = 0;
    if (subcards.length === 1) { suit = subcards[0].suit; rank = subcards[0].rank; }
    else if (subcards.length > 1) {
      const cs = new Set(subcards.map(c => c.color));
      suit = cs.size === 1 ? (subcards[0].color === 'black' ? 'black' : 'red') : 'none';
    }
    const v = Object.assign({ id: null, name, suit, rank, subcards, virtual: true }, extra || {});
    Object.defineProperty(v, 'color', { get() { return this.suit === 'black' ? 'black' : this.suit === 'red' ? 'red' : SUIT_COLOR[this.suit] || 'none'; } });

  // ───────────────────────── 角色 ─────────────────────────
  class Player {
    constructor(seat) {
      this.seat = seat; this.role = null; this.hero = null; this.gender = 'male'; this.faction = null;
      this.maxHp = 4; this.hp = 4; this.dead = false; this.dying = false;
      this.hand = []; this.equips = { weapon: null, armor: null, plus: null, minus: null }; this.judgeZone = [];

    get equipList() { return Object.values(this.equips).filter(Boolean); }

  // ───────────────────────── 游戏 ─────────────────────────
  class Game {
    constructor(opts) {

      if (!ROLESETS[this.n] && !opts.roles) throw new Error('unsupported player count');

      this.cards = {}; // id → Card

    skillList(p) {

    // ── 观看身份（只对观看者可见）──
    learnRole(p, t) { p.knownRoles = p.knownRoles || {}; p.knownRoles[t.seat] = t.role; this.log('viewRole', { seat: p.seat, target: t.seat, private: true }); }
    // ── 询问 ──
    *ask(p, req) {

    *chooseCardsOf(p, t, zones, n, reason, extra) {

      let sel = Array.isArray(a) ? [...new Set(a)].map(id => this.cards[id]).filter(c => c && opts.includes(c)) : [];
      if (sel.length > max) sel = sel.slice(0, max);

      if (cs.length) yield* this.discard(p, cs, reason);

    // ── 触发（时机）──

    *trigger(event, data) {

            finally { if (this._optCtx === oc) { const pe = oc.pending; this._optCtx = prev; if (pe) { const { type: ty0, ...rest } = pe; this.log(ty0, rest); } } }
          }
          if (data.stopTrigger) return data;
        }
      }
      return data;
    }
    describe(data) { // 给请求方的简要信息（避免把整个对象图交出去）
      const o = {};
      for (const k of ['amount', 'nature']) if (data[k] != null) o[k] = data[k];
      for (const k of ['player', 'from', 'to', 'target']) if (data[k] && data[k].seat != null) o[k] = data[k].seat;
      if (data.card) o.card = data.card.name;
      if (data.use) o.card = data.use.card.name;
      return o;
    }

    // ── 体力 ──
    *recover(p, n, source, card) {
      if (p.dead || n <= 0) return 0;
      const d = { player: p, amount: n, source, card };
      yield* this.trigger('recovering', d);
      if (d.prevented) return 0;
      const real = Math.min(d.amount, p.maxHp - p.hp); if (real <= 0) return 0;
      p.hp += real; this.hpChanges++; this.log('recover', { seat: p.seat, n: real, hp: p.hp });
      yield* this.trigger('recovered', { player: p, amount: real, source, card });
      return real;
    }
    *loseHp(p, n, reason) {
      if (p.dead || n <= 0) return;
      p.hp -= n; this.hpChanges++; this.log('loseHp', { seat: p.seat, n, hp: p.hp });
      if (p.hp <= 0) yield* this.dying(p, { reason: 'loseHp' });
      yield* this.trigger('hpLost', { player: p, amount: n, reason });
    }
    // 直接调整体力值（不算伤害或回复）
    *setHp(p, v, reason) {
      if (p.dead) return;
      v = Math.min(v, p.maxHp); if (v === p.hp) return;
      const old = p.hp; p.hp = v; this.hpChanges++;
      this.log('hpSet', { seat: p.seat, hp: v, old, reason });
      if (p.hp <= 0) yield* this.dying(p, { reason: 'hpSet' });
    }
    *changeMaxHp(p, delta, reason) {
      if (p.dead) return;
      p.maxHp += delta; if (p.hp > p.maxHp) p.hp = p.maxHp;
      this.log('maxHp', { seat: p.seat, delta, maxHp: p.maxHp });
      if (p.maxHp <= 0) { yield* this.die(p, null, { reason: 'maxHp' }); return; }
      yield* this.trigger('maxHpChanged', { player: p, delta, reason });
    }

    // ── 伤害 ──
    // d: { from, to, amount, nature:'normal'|'fire'|'thunder', card, use, conducted }
    *damage(d) {
      d = Object.assign({ amount: 1, nature: 'normal', from: null }, d);
      const to = d.to; if (!to || to.dead) return d;
      if (!d.conducted) {
        if (d.from && !d.from.dead) yield* this.trigger('damageCausing', d); // 造成伤害时
        if (d.prevented || d.amount <= 0) { this.log('damagePrevented', { to: to.seat }); return d; }
      }
      d.baseAmount = d.amount; // 传导伤害以此为准（来源一侧的加减已计入，受伤者一侧不计）
      yield* this.trigger('damageTaking', d); // 受到伤害时
      if (d.prevented || d.amount <= 0 || to.dead) { this.log('damagePrevented', { to: to.seat }); return d; }
      const chainedHit = to.chained && d.nature !== 'normal';
      if (chainedHit) { to.chained = false; this.log('chain', { seat: to.seat, on: false }); }
      to.hp -= d.amount; d.done = true; this.hpChanges++;
      if (d.use) d.use.data.dealt = (d.use.data.dealt || 0) + d.amount;
      this.log('damage', { from: d.from ? d.from.seat : null, to: to.seat, n: d.amount, nature: d.nature, hp: to.hp, card: d.card ? d.card.name : null });
      if (to.hp <= 0) yield* this.dying(to, { damage: d, source: d.from });
      if (d.from) yield* this.trigger('damageDone', d);  // 造成伤害后
      yield* this.trigger('damaged', d);                 // 受到伤害后
      if (chainedHit && !d.conducted) {
        for (const q of this.seatOrderFrom(this.current || to)) {
          if (q === to || !q.chained || q.dead) continue;
          yield* this.damage({ from: d.from, to: q, amount: d.baseAmount, nature: d.nature, card: d.card, use: d.use, conducted: true });
        }
      }
      return d;
    }

    // ── 濒死与死亡 ──
    *dying(p, info) {
      if (p.dead || p.hp > 0 || p.dying) return;
      p.dying = true; this.log('dying', { seat: p.seat });
      const data = Object.assign({ player: p }, info || {});
      yield* this.trigger('enterDying', data);
      if (!p.dead && p.hp <= 0 && !data.noSave) {
        for (const q of this.seatOrderFrom(this.current || p)) {
          while (!p.dead && p.hp <= 0 && !q.dead) {
            const pats = q === p ? ['remedy', 'grog'] : ['remedy'];
            const r = yield* this.askRespond(q, { pattern: pats, mode: 'use', reason: 'save', target: p.seat, useTargets: [p], effect: true });
            if (!r) break;
          }
          if (p.dead || p.hp > 0) break;
        }
      }
      p.dying = false;
      if (p.dead) return;
      if (p.hp <= 0) { yield* this.die(p, info ? info.source : null, info); return; }
      yield* this.trigger('leaveDying', { player: p });
    }
    *die(p, killer, info) {
      if (p.dead) return;
      p.dead = true; p.dying = false; p.roleShown = true;
      this.log('death', { seat: p.seat, role: p.role, killer: killer ? killer.seat : null });
      this.checkWin();
      yield* this.trigger('death', { player: p, killer, info });
      // 奖惩
      if (killer && !killer.dead) {
        if (p.role === 'insurgent') { yield* this.draw(killer, 3, 'reward'); }
        else if (p.role === 'keeper' && killer.role === 'chancellor') {
          const all = [...killer.hand, ...killer.equipList]; if (all.length) yield* this.discard(killer, all, 'penalty');
        }
      }
      const rest = [...p.hand, ...p.equipList, ...p.judgeZone];
      if (rest.length) yield* this.moveCards({ cards: rest, to: 'discard', reason: 'death' });
      p.chained = false;
      yield* this.trigger('afterDeath', { player: p, killer });
    }
    checkWin() {
      const alive = this.alive; const sov = this.players.find(p => p.role === 'chancellor');
      if (sov && sov.dead) {
        if (alive.length === 1 && alive[0].role === 'schemer') throw new GameOver(['schemer'], 'schemer');
        throw new GameOver(['insurgent'], 'chancellor-dead');
      }
      if (!alive.some(p => p.role === 'insurgent' || p.role === 'schemer')) throw new GameOver(['chancellor', 'keeper'], 'loyal');
    }

    // ── 天意（判定）──
    // effect*(card) 在改判结束、结果确定后执行；随后判定牌进入弃牌堆（除非被技能获得）
    *judge(p, reason, effect) {
      const [card] = this.takeTop(1);
      const j = { player: p, card, reason, all: [card] };
      this.log('judge', { seat: p.seat, reason, card: card.id });
      yield* this.trigger('judgeRetouch', j);  // 生效前：改判
      { const okf = Game.judgeOk && Game.judgeOk[reason]; this.log('judgeResult', Object.assign({ seat: p.seat, reason, card: j.card.id }, okf ? { ok: !!okf(j.card) } : {})); }
      if (effect) yield* effect(j.card);
      yield* this.trigger('judgeDone', j);      // 生效后（如获得判定牌）
      this.log('judgeClear', { seat: p.seat, cards: j.all.map(c => c.id) });   // 每次判定结算后清掉判定牌
      yield* this.clearProcessing([j.card]);
      return j.card;
    }
    // 改判：以 newCard 替换当前判定牌
    *retouch(j, by, newCard) {
      const old = j.card;
      yield* this.moveCards({ cards: [newCard], to: 'process', by: by.seat, reason: 'retouch' });
      j.card = newCard; if (j.all) j.all.push(newCard);
      this.log('retouch', { seat: by.seat, old: old.id, card: newCard.id });
      if (old.loc && old.loc.zone === 'process') yield* this.toDiscard([old], 'retouch');
    }

    // ── 响应（使用 / 打出）──
    viewAsSkills(p, patterns, ctx) {
      return this.skillList(p).filter(s => {
        const v = s.def.viewAs; if (!v) return false;
        if (!v.patterns.some(x => [].concat(patterns).includes(x))) return false;
        return !v.can || v.can(this, p, ctx, s);
      });
    }
    forbidden(p, c) { return this.q('forbid', false, p, c); }
    canProduce(p, patterns, ctx) {
      if (p.hand.some(c => matches(c, patterns) && !this.forbidden(p, c))) return true;
      return this.viewAsSkills(p, patterns, ctx).length > 0;
    }
    // 把答案 {cardIds, skill} 变成一张（可能是虚拟的）牌；非法返回 null
    buildCard(p, ans, patterns, ctx) {
      if (!ans || !Array.isArray(ans.cardIds)) return null;
      const cs = ans.cardIds.map(id => this.cards[id]);
      if (cs.some(c => !c)) return null;
      if (ans.skill) {
        const inst = this.skillList(p).find(s => (s.key === ans.skill || s.id === ans.skill) && s.def.viewAs);
        if (!inst) return null;
        const v = inst.def.viewAs;
        if (v.can && !v.can(this, p, ctx, inst)) return null;
        const zones = v.zones || 'h';
        if (cs.some(c => !this.cardsIn(p, zones).includes(c))) return null;
        const n = v.count == null ? 1 : v.count;
        if (cs.length !== n) return null;
        if (v.filter && cs.some(c => !v.filter(this, p, c, ctx))) return null;
        const name = typeof v.as === 'function' ? v.as(this, p, cs, ctx, ans) : v.as;
        if (!name) return null;
        const vc = virtualCard(name, cs, { viaSkill: inst.id });
        if (patterns && !matches(vc, patterns)) return null;
        return vc;
      }
      if (cs.length !== 1) return null;
      const c = cs[0];
      if (!p.hand.includes(c) || this.forbidden(p, c)) return null;
      if (patterns && !matches(c, patterns)) return null;
      return c;
    }
    // req: { pattern, mode:'use'|'play', reason, useTargets?, effect?, source? }
    *askRespond(p, req) {
      if (!p || p.dead) return null;
      const pats = [].concat(req.pattern);
      const pre = { player: p, req: Object.assign({}, req, { pattern: pats }), result: null };
      yield* this.trigger('askResponse', pre);   // 如 雅典娜之盾 判定、号令/勤王
      if (p.dead) return null;
      let card = pre.result;
      if (!card) {
        if (!this.canProduce(p, pats, req)) return null;
        const ans = yield* this.ask(p, Object.assign({}, req, { kind: 'respond', pattern: pats, useTargets: undefined, targets: req.useTargets ? req.useTargets.map(t => t.seat) : undefined }));
        card = this.buildCard(p, ans, pats, req);
        if (!card) return null;
      }
      yield* this.finishResponse(p, card, req, pre.by);
      return card;
    }
    *finishResponse(p, card, req, by) {
      const actor = by || p;
      if (req.mode === 'use') {
        yield* this.useCard(actor, card, req.useTargets || [], { response: !req.effect, save: req.reason === 'save', for: p, req });
      } else {
        const real = card.subcards.filter(c => !c.virtual);
        this.log('play', { seat: actor.seat, card: card.name, ids: real.map(c => c.id), reason: req.reason });
        if (real.length) yield* this.moveCards({ cards: real, to: 'process', by: actor.seat, reason: 'play' });
        yield* this.trigger('cardPlayed', { player: actor, card, req, for: p });
        yield* this.clearProcessing(real);
      }
    }

    // ── 力挽狂澜（无懈可击）链 ──
    // effect: { use, target } 或 { veto: card, from, target: effect }。返回 true 表示被抵消。
    *askVeto(effect) {
      // 自己使用的单目标锦囊不问自己（多目标仍会问）
      const selfSingle = effect.use && effect.use.from && effect.use.targets && effect.use.targets.length === 1 ? effect.use.from : null;
      // 参照无名杀：没有人能出无懈可击时不开无懈窗口，直接结算
      const can = this.seatOrderFrom(this.current || this.players[0]).filter(q => q !== selfSingle && !q.dead && this.canProduce(q, ['veto'], { reason: 'veto' }));
      if (!can.length) return false;
      this.log('vetoWindow', { of: this.describeEffect(effect), skip: selfSingle ? selfSingle.seat : null, who: can.map(q => q.seat) });
      for (let guard = 0; guard < 100; guard++) {
        let countered = false, someone = false;
        for (const q of this.seatOrderFrom(this.current || this.players[0])) {
          if (q === selfSingle) continue;
          if (!this.canProduce(q, ['veto'], { reason: 'veto' })) continue;
          const card = yield* this.askRespond(q, { pattern: ['veto'], mode: 'use', reason: 'veto', vetoOf: this.describeEffect(effect) });
          if (!card) continue;
          someone = true;
          const cancelled = yield* this.askVeto({ veto: card, from: q, target: effect });
          if (!cancelled) { countered = true; }
          break; // 有人出过一张后重新从头询问
        }
        if (!someone) return false;
        if (countered) {
          // 原效果被抵消；但仍可再被别人"抵消这次抵消"——这已在递归中处理，直接返回
          return true;
        }
        // 出的力挽狂澜被抵消了：重新询问是否还有人要抵消原效果
      }
      return false;
    }
    describeEffect(e) {
      if (e.use) return { card: e.use.card.name, from: e.use.from ? e.use.from.seat : null, target: e.target ? e.target.seat : null };
      if (e.veto) return { card: 'veto', from: e.from.seat, of: this.describeEffect(e.target) };
      if (e.omen) return { card: e.omen.name, target: e.target.seat, omen: true };
      return {};
    }

    // ── 用牌 ──
    targetSpec(p, card) { const d = CARD_DEFS[card.name]; return d && d.targets; }
    // 第 k 个目标的候选（依赖已选 selected）
    targetCandidates(p, card, selected) {
      const d = CARD_DEFS[card.name]; selected = selected || [];
      const spec = d.targets; if (!spec || typeof spec === 'string') return [];
      return this.alive.filter(t => !selected.includes(t) && spec.filter(this, p, t, selected, card, {}) && this.targetAllowed(p, t, card));
    }
    targetAllowed(user, t, card) { return this.q('canTarget', true, user, t, card); }
    maxTargets(p, card) {
      const spec = CARD_DEFS[card.name].targets; if (!spec || typeof spec === 'string') return 0;
      let m = typeof spec.max === 'function' ? spec.max(this, p, card) : spec.max;
      if (spec.extendable !== false) m = this.q('maxTargets', m, p, card);
      return m;
    }
    autoTargets(p, card) {
      const d = CARD_DEFS[card.name]; const spec = d.targets;
      let list;
      if (spec === 'self') list = [p];
      else if (spec === 'others') list = this.seatOrderFrom(this.nextAlive(p)).filter(t => t !== p);
      else if (spec === 'all') list = this.seatOrderFrom(p);
      else if (spec === 'none') list = [];
      else return null;
      return list.filter(t => this.targetAllowed(p, t, card));
    }
    canUseCard(p, card, targets, opts) {
      opts = opts || {};
      const d = CARD_DEFS[card.name]; if (!d) return false;
      if (d.canUse && !d.canUse(this, p, card, opts)) return false;
      const auto = this.autoTargets(p, card);
      if (auto) {
        if (d.needTargets && !auto.length) return false;
        return true;
      }
      targets = targets || [];
      const spec = d.targets;
      const min = spec.min == null ? 1 : spec.min, max = this.maxTargets(p, card);
      if (targets.length < min || targets.length > max) return false;
      const sel = [];
      for (const t of targets) {
        if (!t || t.dead || sel.includes(t)) return false;
        if (!spec.filter(this, p, t, sel, card, opts) || !this.targetAllowed(p, t, card)) return false;
        sel.push(t);
      }
      if (spec.check && !spec.check(this, p, sel, card)) return false;
      if (!this.q('targetsValid', true, p, card, sel)) return false;
      return true;
    }
    // 出牌阶段内能否主动使用（有无合法目标）
    playable(p, card, o) {
      const d = CARD_DEFS[card.name]; if (!d || d.noActiveUse) return false;
      if (!card.virtual && this.forbidden(p, card)) return false;
      if (d.canUse && !d.canUse(this, p, card, o || { phase: true })) return false;
      if (this.autoTargets(p, card)) return this.canUseCard(p, card, [], o || { phase: true });
      return this.targetCandidates(p, card, []).length > 0;
    }

    // use: { card, from, targets, data, nullified:Set, noResponse:Set, extraDamage }
    // 中央出牌区的清理（参照无名杀 useCardAfter）：最外层的一次用牌完全结算完（含闪、无懈、伤害、求药）才清空；
    // 无懈可击本身不清，跟随外层锦囊 / 天兆一起清
    *useCard(from, card, targets, opts) {
      this.useDepth = (this.useDepth || 0) + 1;
      let use;
      try { use = yield* this.useCardInner(from, card, targets, opts); }
      finally { this.useDepth--; }
      if (this.useDepth === 0 && card.name !== 'veto') this.log('tableClear', { reason: 'use', card: card.name });
      return use;
    }
    *useCardInner(from, card, targets, opts) {
      opts = opts || {};
      const d = CARD_DEFS[card.name];
      if (targets == null) targets = this.autoTargets(from, card) || [];
      const use = { id: ++this.seq, card, from, targets: targets.slice(), opts, data: {}, nullified: new Set(), noResponse: new Set(), extraDamage: 0 };
      if (!d.orderedTargets) use.targets = this.orderBySeat(use.targets);   // 多个目标：从当前回合角色开始按行动顺序结算（官方规则集 3.0「结算的原则」）
      const real = card.subcards.filter(c => !c.virtual);
      this.log('use', { seat: from.seat, card: card.name, ids: real.map(c => c.id), targets: use.targets.map(t => t.seat), virtual: !!card.virtual, skill: card.viaSkill || null });
      if (real.length) yield* this.moveCards({ cards: real, to: 'process', by: from.seat, reason: 'use' });
      if (family(card) === 'strike' && opts.phase && !opts.noCount) { from.phaseState.strikes = (from.phaseState.strikes || 0) + 1; }
      if (card.name === 'grog' && !opts.save) from.turnState.grogs = (from.turnState.grogs || 0) + 1;
      if (this.current === from) {
        from.turnState.lastUsed = card.name;
        if ((CARD_DEFS[card.name] || {}).type !== 'equip') from.turnState.lastUsedNE = card.name;   // 本回合上一张使用的非装备牌
        if (family(card) === 'strike' && this.phase === 'play') from.turnState.usedStrikeInPlay = true;
      }
      if (d.prepare) d.prepare(this, use);

      if (d.type === 'equip') {
        yield* this.trigger('cardUsing', { use });
        yield* this.equip(from, card);
        yield* this.trigger('cardUsed', { use });
        return use;
      }
      if (d.type === 'omen') {
        yield* this.trigger('cardUsing', { use });
        const t = use.targets[0];
        if (t && !t.dead && real.length) {
          // 天兆牌以其"当作的牌名"放置
          const c = real[0]; c.omenAs = card.name;
          yield* this.moveCards({ cards: [c], to: 'judge', toPlayer: t, by: from.seat, reason: 'omen' });
        }
        yield* this.trigger('cardUsed', { use });
        yield* this.clearProcessing(real);
        return use;
      }

      // 酒的加成
      if (family(card) === 'strike' && from.turnState.drunk) { use.extraDamage += 1; from.turnState.drunk = false; use.data.drunk = true; }
      yield* this.trigger('cardUsing', { use });      // 使用时（如 火绳枪改火杀）
      if (!opts.response) {
        yield* this.trigger('targeting', { use });    // 指定目标时（可改目标）
        if (!d.orderedTargets) use.targets = this.orderBySeat(use.targets);
        for (const t of use.targets.slice()) yield* this.trigger('targeted', { use, target: t }); // 成为目标时
        // 目标可能被转移 / 增加：新目标按座次插入，不排在最前或最后（例：流离转移后，从当前回合角色起按逆时针依次结算）
        if (!d.orderedTargets) use.targets = this.orderBySeat(use.targets);
        yield* this.trigger('targetConfirmed', { use }); // 指定目标后
        if (!use.data.aborted) for (const t of use.targets.slice()) yield* this.trigger('becameTarget', { use, target: t }); // 成为目标后
        if (!d.orderedTargets) use.targets = this.orderBySeat(use.targets);
        if (use.data.aborted) {}   // 结算被中止（如三皇改为视为使用杀）：这张牌不再产生任何效果
        else {
        if (d.before) yield* d.before(this, use);
        if (d.targets === 'none' && d.effect) {
          yield* d.effect(this, use, null);
        } else {
          for (const t of use.targets.slice()) {
            if (this.over) break;
            if (t.dead && !d.allowDeadTarget) continue;
            if (use.nullified.has(t)) continue;
            if (d.skipTarget && d.skipTarget(this, use, t)) continue;
            const pre = { use, target: t, cancel: false };
            yield* this.trigger('effectBefore', pre); // 生效前（龟甲阵、亚麻胸甲判"无效"）
            if (pre.cancel) { use.nullified.add(t); this.log('nullified', { seat: t.seat, card: card.name }); continue; }
            if (d.type === 'stratagem' && !use.data.unvetoable && !opts.noVeto) {
              if (d.vetoable === false) {} else if (yield* this.askVeto({ use, target: t })) { use.nullified.add(t); this.log('vetoed', { seat: t.seat, card: card.name }); continue; }
            }
            if (t.dead && !d.allowDeadTarget) continue;
            if (d.effect) yield* d.effect(this, use, t);
          }
        }
        if (d.after) yield* d.after(this, use);
        }
      }
      yield* this.trigger('cardUsed', { use }); // 使用结算后
      yield* this.clearProcessing(real);
      return use;
    }
    // 视为使用（无实体牌）
    *useVirtual(from, name, targets, opts, subcards) { return yield* this.useCard(from, virtualCard(name, subcards || []), targets, opts); }

    *equip(p, card) {
      const d = CARD_DEFS[card.name]; const slot = d.sub;
      const old = p.equips[slot];

        role: (p.roleShown || viewer === p.seat || viewer === 'all') ? p.role : null,

    type: 'stratagem',

    *effect(g, use, t) { const c = yield* g.chooseCardOf(use.from, t, 'hej', 'pilfer'); if (c) yield* g.gainCards(use.from, [c], 'pilfer', t); },
  };
  // 驱虎吞狼（新效果）：令其视为对其攻击范围内你指定的另一名角色使用杀；此杀未造成伤害，则其视为对你使用杀
  CARD_DEFS.catspaw = { orderedTargets: true,   // 两个目标有不同含义（持刀者、被杀者），不能按座次重排

    type: 'stratagem',
    targets: {
      min: 2, max: 2, extendable: false,
      filter: (g, p, t, sel) => sel.length === 0
        ? (t !== p && g.alive.some(v => v !== t && v !== p && g.inAttackRange(t, v)))
        : (t !== p && g.inAttackRange(sel[0], t)),
    },
    prepare(g, use) { if (use.targets.length === 2) { use.data.victim = use.targets[1]; use.targets = [use.targets[0]]; } },
    *effect(g, use, t) {
      const v = use.data.victim;
      if (!v || v.dead || t.dead) return;
      let dealt = false;
      const s1 = virtualCard('strike', [], { viaCard: 'catspaw' });
      if (g.targetAllowed(t, v, s1)) { const u = yield* g.useCard(t, s1, [v], { noCount: true, ignoreDistance: true }); dealt = !!u.data.dealt; }
      const from = use.from;
      if (!dealt && !t.dead && !from.dead) {
        const s2 = virtualCard('strike', [], { viaCard: 'catspaw' });
        if (g.targetAllowed(t, from, s2)) yield* g.useCard(t, s2, [from], { noCount: true, ignoreDistance: true });
      }
    },
  };
  const aoe = (pattern, mode) => ({
    type: 'stratagem', targets: 'others', needTargets: true,
    *effect(g, use, t) {
      const r = yield* g.askRespond(t, { pattern: [pattern], mode, reason: use.card.name, use, source: use.from.seat });
      if (!r && !t.dead) yield* g.damage({ from: use.from.dead ? null : use.from, to: t, amount: 1, card: use.card, use });
    },
  });
  CARD_DEFS.invasion = aoe('strike', 'play');
  CARD_DEFS.arrowstorm = aoe('parry', 'play');
  CARD_DEFS.respite = {
    type: 'stratagem', targets: 'all',
    canUse: (g) => g.alive.some(p => p.wounded),
    skipTarget: (g, use, t) => !t.wounded,
    *effect(g, use, t) { yield* g.recover(t, 1, use.from, use.card); },
  };
  CARD_DEFS.feast = {
    type: 'stratagem', targets: 'all',
    *before(g, use) { use.data.pool = g.takeTop(use.targets.length); g.log('reveal', { cards: use.data.pool.map(c => c.id), reason: 'feast' }); },
    *effect(g, use, t) {
      const pool = use.data.pool.filter(c => c.loc && c.loc.zone === 'process'); if (!pool.length) return;
      const a = yield* g.ask(t, { kind: 'pick', options: pool.map(c => c.id), reason: 'feast' });
      const c = pool.find(x => x.id === a) || pool[0];
      yield* g.gainCards(t, [c], 'feast');
    },
    *after(g, use) { yield* g.clearProcessing(use.data.pool || []); },
  };
  CARD_DEFS.greekfire = {
    type: 'stratagem', targets: { min: 1, max: 1, filter: (g, p, t) => t.hand.length > 0 },
    *effect(g, use, t) {
      if (!t.hand.length) return;
      const [shown] = yield* g.chooseOwnCards(t, 1, 1, 'h', 'greekfireShow');
      g.log('show', { seat: t.seat, card: shown.id });
      const from = use.from; if (from.dead) return;
      const d = yield* g.askDiscard(from, 0, 1, 'h', 'greekfire', c => c.suit === shown.suit, { shown: shown.id });
      if (d.length) yield* g.damage({ from, to: t, amount: 1, nature: 'fire', card: use.card, use });
    },
  };
  CARD_DEFS.chainshot = {
    type: 'stratagem', recastable: true, targets: { min: 1, max: 2, filter: () => true },
    *effect(g, use, t) { t.chained = !t.chained; g.log('chain', { seat: t.seat, on: t.chained }); },
  };

  // ───────── 天兆牌（延时锦囊）─────────
  const noSame = (name) => (t) => !t.judgeZone.some(c => (c.omenAs || c.name) === name);
  function* passDamocles(g, p, c) {
    let q = p;
    for (let i = 0; i < g.n; i++) {
      q = g.nextAlive(q); if (!q || q === p) break;
      if (noSame('damocles')(q) && g.targetAllowed(p, q, c)) {
        c.omenAs = 'damocles';
        yield* g.moveCards({ cards: [c], to: 'judge', toPlayer: q, reason: 'damoclesMove' });
        g.log('damoclesMove', { from: p.seat, to: q.seat }); return;
      }
    }
    // 无人可传：留在原处
    c.omenAs = 'damocles';
    yield* g.moveCards({ cards: [c], to: 'judge', toPlayer: p, reason: 'damoclesStay' });
  }
  CARD_DEFS.lotus = {
    type: 'omen', targets: { min: 1, max: 1, filter: (g, p, t) => t !== p && noSame('lotus')(t) },
    *judgeEffect(g, p) { yield* g.judge(p, 'lotus', function* (c) { if (c.suit !== 'heart') { g.skipPhase(p, 'play'); g.log('omenHit', { seat: p.seat, card: 'lotus' }); } }); },
  };
  CARD_DEFS.blockade = {
    type: 'omen', targets: { min: 1, max: 1, filter: (g, p, t, s, card) => t !== p && noSame('blockade')(t) && (g.distance(p, t) <= 1 || noDist(g, p, t, card)) },
    *judgeEffect(g, p) { yield* g.judge(p, 'blockade', function* (c) { if (c.suit !== 'club') { g.skipPhase(p, 'draw'); g.log('omenHit', { seat: p.seat, card: 'blockade' }); } }); },
  };
  CARD_DEFS.damocles = {
    type: 'omen', targets: 'self',
    canUse: (g, p) => noSame('damocles')(p),
    *judgeEffect(g, p, omen) {
      let hit = false;
      yield* g.judge(p, 'damocles', function* (c) {
        if (c.suit === 'spade' && c.rank >= 2 && c.rank <= 9) {
          hit = true; g.log('omenHit', { seat: p.seat, card: 'damocles' });
          yield* g.damage({ from: null, to: p, amount: 3, nature: 'thunder', card: omen });
        }
      });
      if (!hit && omen.loc && omen.loc.zone === 'process') yield* passDamocles(g, p, omen);
    },
    *onVetoed(g, p, omen) { yield* passDamocles(g, p, omen); },
  };
  // 天兆牌的 omen 自身"使用"时，目标是 self 的情况由 autoTargets 处理

  // ───────── 军备牌 ─────────
  const eq = (sub, extra) => Object.assign({ type: 'equip', sub, targets: 'self' }, extra);
  const strikeBy = (owner, use) => use && use.from === owner && isStrike(use.card);
  const weapon = (range, skill) => eq('weapon', { range, skill });

  CARD_DEFS.gatling = weapon(1, { locked: true, mods: { strikeLimit: (g, o, v, p) => p === o ? Infinity : v } });
  CARD_DEFS.excalibur = weapon(2, { locked: true, triggers: { targetConfirmed: {
    can: (g, o, d) => strikeBy(o, d.use),
    *on(g, o, d) { d.use.data.ignoreArmor = d.use.data.ignoreArmor || new Set(); d.use.targets.forEach(t => d.use.data.ignoreArmor.add(t)); },
  } } });
  CARD_DEFS.gemini = weapon(2, { triggers: { targetConfirmed: {
    can: (g, o, d) => strikeBy(o, d.use) && d.use.targets.some(t => t.gender !== o.gender),
    *on(g, o, d) {
      for (const t of d.use.targets) {
        if (t.gender === o.gender || t.dead || o.dead) continue;
        const i = t.hand.length ? yield* g.chooseOption(t, ['discardHand', 'letDraw'], 'gemini') : 1;
        if (i === 0) yield* g.askDiscard(t, 1, 1, 'h', 'gemini'); else yield* g.draw(o, 1, 'gemini');
      }
    },
  } } });
  CARD_DEFS.winter = weapon(2, { triggers: { damageCausing: {
    can: (g, o, d) => strikeBy(o, d.use) && d.card === d.use.card && d.to.cardCount > 0 && d.to !== o,
    *on(g, o, d) {
      d.prevented = true;
      const cs = yield* g.chooseCardsOf(o, d.to, 'he', 2, 'winter');
      if (cs.length) { yield* g.moveCards({ cards: cs, to: 'discard', by: o.seat, reason: 'winter' }); for (const c of cs) g.log('discardOf', { by: o.seat, seat: d.to.seat, card: c.id }); yield* g.trigger('discarded', { player: d.to, cards: cs, by: o, reason: 'winter' }); }
    },
  } } });
  CARD_DEFS.misericorde = weapon(2, { locked: true, triggers: { damageCausing: {
    can: (g, o, d) => strikeBy(o, d.use) && d.card === d.use.card && d.to.hand.length === 0,
    *on(g, o, d) { d.amount += 1; },
  } } });
  CARD_DEFS.berserker = weapon(3, { triggers: { strikeParried: {
    optional: false,
    can: (g, o, d) => strikeBy(o, d.use) && !d.target.dead && g.canProduce(o, ['strike'], {}),
    *on(g, o, d) { yield* g.askUseStrike(o, [d.target], 'berserker', { ignoreDistance: true }); },
  } } });
  CARD_DEFS.sarissa = weapon(3, { viewAs: { patterns: ['strike'], as: 'strike', count: 2, zones: 'h', can: (g, p) => p.hand.length >= 2 } });
  CARD_DEFS.ram = weapon(3, { triggers: { strikeParried: {
    can: (g, o, d) => strikeBy(o, d.use) && !d.target.dead && g.cardsIn(o, 'he').filter(c => c.name !== 'ram').length >= 2,
    *on(g, o, d) { const cs = yield* g.askDiscard(o, 2, 2, 'he', 'ram', c => c.name !== 'ram'); if (cs.length === 2) d.hit = true; },
  } } });
  CARD_DEFS.trident = weapon(4, { mods: { maxTargets: (g, o, v, p, card) => {
    if (p !== o || !isStrike(card)) return v;
    const subs = card.subcards || [card];
    return (p.hand.length > 0 && p.hand.every(c => subs.includes(c))) ? v + 2 : v;
  } } });
  CARD_DEFS.arquebus = weapon(4, { triggers: { cardUsing: {
    can: (g, o, d) => d.use.from === o && d.use.card.name === 'strike',
    *on(g, o, d) { const old = d.use.card; d.use.card = virtualCard('fire_strike', old.subcards.filter(c => !c.virtual), { suit: old.suit, rank: old.rank, viaSkill: 'arquebus' }); },
  } } });
  CARD_DEFS.longbow = weapon(5, { triggers: { damageCausing: {
    can: (g, o, d) => strikeBy(o, d.use) && d.card === d.use.card && [d.to.equips.plus, d.to.equips.minus].some(c => c && !g.q('protectCard', false, c, o, d.to)),
    *on(g, o, d) {
      const ms = [d.to.equips.plus, d.to.equips.minus].filter(c => c && !g.q('protectCard', false, c, o, d.to)); if (!ms.length) return;
      const i = yield* g.chooseOption(o, ms.map(c => c.name), 'longbow');
      yield* g.moveCards({ cards: [ms[i] || ms[0]], to: 'discard', by: o.seat, reason: 'longbow' });
    },
  } } });

  const armorOn = (g, o, use) => !!g.armorOf(o, use);
  Game.judgeOk.aegis = c => c.color === 'red';   // 八卦阵类：红色则视为出闪，生效
  CARD_DEFS.aegis = eq('armor', { skill: { triggers: { askResponse: {
    can: (g, o, d) => d.player === o && d.req.pattern.includes('parry') && armorOn(g, o, d.req.use) && !d.result,
    *on(g, o, d) {
      const c = yield* g.judge(o, 'aegis');
      if (c.color === 'red') d.result = virtualCard('parry', [], { viaSkill: 'aegis' });
    },
  } } } });
  CARD_DEFS.testudo = eq('armor', { skill: { locked: true, triggers: { effectBefore: {
    can: (g, o, d) => d.target === o && isStrike(d.use.card) && d.use.card.color === 'black' && armorOn(g, o, d.use),
    *on(g, o, d) { d.cancel = true; },
  } } } });
  CARD_DEFS.linothorax = eq('armor', { skill: { locked: true, triggers: {
    effectBefore: {
      can: (g, o, d) => d.target === o && armorOn(g, o, d.use) && (d.use.card.name === 'strike' || d.use.card.name === 'invasion' || d.use.card.name === 'arrowstorm'),
      *on(g, o, d) { d.cancel = true; },
    },
    damageTaking: {
      can: (g, o, d) => d.to === o && d.nature === 'fire' && armorOn(g, o, d.use),
      *on(g, o, d) { d.amount += 1; },
    },
  } } });
  CARD_DEFS.nemean = eq('armor', {
    skill: { locked: true, triggers: { damageTaking: {
      can: (g, o, d) => d.to === o && d.amount > 1 && armorOn(g, o, d.use),
      *on(g, o, d) { d.amount = 1; },
    } } },
    *onUnequip(g, owner) { yield* g.recover(owner, 1, null); },
  });

  const plus = () => eq('plus', { skill: { locked: true, mods: { distance: (g, o, v, a, b) => b === o ? v + 1 : v } } });
  const minus = () => eq('minus', { skill: { locked: true, mods: { distance: (g, o, v, a, b) => a === o ? v - 1 : v } } });
  for (const n of ['bucephalus', 'babieca', 'marengo', 'copenhagen']) CARD_DEFS[n] = plus();
  for (const n of ['pegasus', 'sleipnir', 'arion']) CARD_DEFS[n] = minus();

  // cards.json 为准：名字、攻击范围、坐骑 ±1
  const BY_KEY = {};
  for (const c of DATA || []) {
    BY_KEY[c.key] = c;
    CARD_TEXT[c.key] = [c.zh, c.en.replace(/\u2019/g, "'")];
    const d = CARD_DEFS[c.key]; if (!d) continue;
    if (c.range != null) d.range = c.range;
    if (c.distance != null && d.sub !== (c.distance > 0 ? 'plus' : 'minus')) throw new Error('mount mismatch ' + c.key);
  }
  for (const [k, [zh, en]] of Object.entries(CARD_TEXT)) if (CARD_DEFS[k]) { CARD_DEFS[k].zh = zh; CARD_DEFS[k].en = en; }

  // ───────── 牌堆（160）─────────
  const S = 'spade', H = 'heart', C = 'club', D = 'diamond';
  const DECK = [];
  const add = (suit, rank, ...names) => names.forEach(n => DECK.push([n, suit, rank]));
  // 标准 104
  add(S, 1, 'damocles', 'duel'); add(S, 2, 'gemini', 'aegis'); add(S, 3, 'sabotage', 'pilfer'); add(S, 4, 'sabotage', 'pilfer');
  add(S, 5, 'berserker', 'bucephalus'); add(S, 6, 'excalibur', 'lotus'); add(S, 7, 'strike', 'invasion');
  add(S, 8, 'strike', 'strike'); add(S, 9, 'strike', 'strike'); add(S, 10, 'strike', 'strike');
  add(S, 11, 'pilfer', 'veto'); add(S, 12, 'sarissa', 'sabotage'); add(S, 13, 'sleipnir', 'invasion');
  add(H, 1, 'respite', 'arrowstorm'); add(H, 2, 'parry', 'parry'); add(H, 3, 'remedy', 'feast'); add(H, 4, 'remedy', 'feast');
  add(H, 5, 'longbow', 'pegasus'); add(H, 6, 'remedy', 'lotus'); add(H, 7, 'remedy', 'windfall'); add(H, 8, 'remedy', 'windfall');
  add(H, 9, 'remedy', 'windfall'); add(H, 10, 'strike', 'strike'); add(H, 11, 'strike', 'windfall'); add(H, 12, 'remedy', 'sabotage');
  add(H, 13, 'parry', 'marengo');
  add(C, 1, 'duel', 'gatling'); add(C, 2, 'strike', 'aegis'); add(C, 3, 'strike', 'sabotage'); add(C, 4, 'strike', 'sabotage');
  add(C, 5, 'strike', 'babieca'); add(C, 6, 'strike', 'lotus'); add(C, 7, 'strike', 'invasion'); add(C, 8, 'strike', 'strike');
  add(C, 9, 'strike', 'strike'); add(C, 10, 'strike', 'strike'); add(C, 11, 'strike', 'strike'); add(C, 12, 'catspaw', 'veto');
  add(C, 13, 'catspaw', 'veto');
  add(D, 1, 'duel', 'gatling'); add(D, 2, 'parry', 'parry'); add(D, 3, 'parry', 'pilfer'); add(D, 4, 'parry', 'pilfer');
  add(D, 5, 'parry', 'ram'); for (let r = 6; r <= 10; r++) add(D, r, 'parry', 'strike'); add(D, 11, 'parry', 'parry');
  add(D, 12, 'remedy', 'trident'); add(D, 13, 'strike', 'arion');
  // EX 4
  add(S, 2, 'winter'); add(C, 2, 'testudo'); add(H, 12, 'damocles'); add(D, 12, 'veto');
  // 军争 52
  add(S, 1, 'misericorde'); add(S, 2, 'linothorax'); add(S, 3, 'grog'); for (let r = 4; r <= 8; r++) add(S, r, 'thunder_strike');
  add(S, 9, 'grog'); add(S, 10, 'blockade'); add(S, 11, 'chainshot'); add(S, 12, 'chainshot'); add(S, 13, 'veto');
  add(H, 1, 'veto'); add(H, 2, 'greekfire'); add(H, 3, 'greekfire'); add(H, 4, 'fire_strike'); add(H, 5, 'remedy'); add(H, 6, 'remedy');
  add(H, 7, 'fire_strike'); add(H, 8, 'parry'); add(H, 9, 'parry'); add(H, 10, 'fire_strike'); add(H, 11, 'parry'); add(H, 12, 'parry'); add(H, 13, 'veto');
  add(C, 1, 'nemean'); add(C, 2, 'linothorax'); add(C, 3, 'grog'); add(C, 4, 'blockade'); for (let r = 5; r <= 8; r++) add(C, r, 'thunder_strike');
  add(C, 9, 'grog'); for (let r = 10; r <= 13; r++) add(C, r, 'chainshot');
  add(D, 1, 'arquebus'); add(D, 2, 'remedy'); add(D, 3, 'remedy'); add(D, 4, 'fire_strike'); add(D, 5, 'fire_strike');
  add(D, 6, 'parry'); add(D, 7, 'parry'); add(D, 8, 'parry'); add(D, 9, 'grog'); add(D, 10, 'parry'); add(D, 11, 'parry');
  add(D, 12, 'greekfire'); add(D, 13, 'copenhagen');

  Game.defaultDeck = () => DECK.slice();
  // 美术资源 key：火杀、雷杀暂用杀的图
  const artKey = (name) => (name === 'fire_strike' || name === 'thunder_strike') ? 'strike' : name;
  return { CARD_TEXT, DECK, BY_KEY, artKey, DATA: DATA || [] };
});

<script>
/* 群星议会 — 武将与技能
 * 每名武将一段：资料 + 技能（时机、条件、效果、AI 判断、中英文字）。改一个只动一段。
 * 标注的地方是技能文字有歧义、按三国杀惯例先做的理解，等用户确认。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./qx-engine.js'), require('./qx-cards.js'));
  else root.QXHeroes = factory(root.QXEngine, root.QXCards);
})(typeof self !== 'undefined' ? self : this, function (E) {
  'use strict';
  const S = E.SKILLS, H = E.HEROES, V = E.virtualCard;
  const isStrike = c => !!c && E.family(c) === 'strike';
  const strikeBy = (o, use) => !!use && use.from === o && isStrike(use.card);
  const lost = p => p.maxHp - p.hp;
  // 其他角色依次结算：从当前回合角色开始按行动顺序（自己的回合里就是从下家开始）
  const others = (g, p) => g.seatOrderFrom(g.current && !g.current.dead && g.current !== p ? g.current : (g.nextAlive(p) || p)).filter(q => q !== p);
  const uniqueMax = (g, p) => g.alive.every(q => q === p || q.hand.length < p.hand.length);

  const FACTIONS = {
    classical: { name: ['古典', 'Classical'], color: '#B8732E' },
    medieval: { name: ['中古', 'Medieval'], color: '#3E5A78' },
    renaissance: { name: ['文艺', 'Renaissance'], color: '#2E7D6A' },
    revolution: { name: ['革新', 'Revolution'], color: '#8E1F2C' },
  };
  // 技能选项等界面文字
  const OPTION_TEXT = {
    gordianNoParry: ['此杀不可被闪响应', 'Cannot Be Parried'], gordianPlus: ['此杀伤害 +1', '+1 Damage'],
    defianceDiscard: ['弃置 {n} 张牌', 'Discard {n} Cards'], defianceEnd: ['结束出牌阶段', 'End Play Phase'],
    vengeanceDiscard: ['弃置 {n} 张手牌', 'Discard {n} Cards'], vengeanceDamage: ['受到 1~2 点伤害', 'Take 1–2 Damage'],
    lecture1: ['讲学·各交一张', 'Lecture: Gather'], lecture2: ['讲学·交换手牌', 'Lecture: Swap'],
  };
  const PROMPT_TEXT = {
    mirrorRetouch: ['镜火：可以打出一张手牌代替{t}的天意牌（当前 {c}）。', "Mirror: you may play a card to replace {t}'s Fate card (now {c})."],
    lectureGive: ['讲学：请交给{t}一张手牌。', 'Lecture: give {t} a card from your hand.'],
    proofGive: ['推演：选择一张牌交给{t}。', 'Proof: choose a card to give to {t}.'],
    defianceDiscard: ['拒降：请弃置 {n} 张牌。', 'Defiance: discard {n} cards.'],
    vengeanceDiscard: ['血誓：请弃置 {n} 张手牌。', 'Vengeance: discard {n} cards from your hand.'],
    unchainGive: ['挣锁：将 {c} 交给一名角色（可以是自己）。', 'Unchain: give {c} to a character (yourself included).'],
    rally: ['号令：是否替{t}打出一张【杀】？', 'Rally: play a Strike on behalf of {t}?'],
    narrows: ['隘口：可以立即对{t}使用一张【杀】。', 'Narrows: you may immediately use a Strike on {t}.'],
    defianceOpt: ['拒降：你的杀造成了伤害，选择一项：', 'Defiance: your Strike dealt damage. Choose one:'],
    vengeanceOpt: ['血誓：选择一项：', 'Vengeance: choose one:'],
    gordianOpt: ['断结：选择一项：', 'Gordian: choose one:'],
  };

<script>
/* 群星议会 · 统一询问框架（qx-ask.js）
 *
 * 思路：每一次「询问」（出牌阶段、出闪、无懈、选目标、弃牌……）都转成同一种「模式」对象：

 *   ok()    : 额外的「能否确定」条件

 * 每次点击只改「已选」，然后 refresh() 统一重算：可选的牌、可选的角色、确定按钮。

        cards: { pool: byIds(req.options), filter: () => true, min: 1, max: req.options.length },
        targets: { min: 1, max: 1, keep: true, filter: p => req.targets.includes(p.seat) },
        ok: () => u.sel.length > 0 && u.targets.length === 1,
        answer: () => ({ cards: u.sel.map(c => c.id), target: u.targets[0].seat }),
      };
    }
    return null;
  }
  // ── 按钮类询问（弹窗里的牌 / 选项 / 武将）：参照无名杀 chooseButton——同样走「可选 / 已选 / 确定」；
  //    只需选一项的直接点即确定（auto），多选需点确定
  function buttonMode(t) {
    const u = t.ui, g = t.g, req = u.req, k = req.kind;
    const one = (items, answer, extra) => Object.assign({ kind: k, cards: NONE, targets: NONE, buttons: { items, filter: () => true, min: 1, max: 1, auto: true }, ok: () => u.btn.length === 1, answer, cancel: !!req.optional }, extra || {});
    if (k === 'chooseCard') {
      const n = Math.min(req.count || 1, req.options.length);
      if (n <= 1) return one(req.options, () => u.btn[0]);
      return { kind: k, cards: NONE, targets: NONE, buttons: { items: req.options, filter: () => true, min: n, max: n }, ok: () => u.btn.length === n, answer: () => u.btn.slice(), cancel: !!req.optional };
    }
    if (k === 'pick' && req.multi) {
      const n = req.multi.count;
      const filter = (id, picked) => !req.multi.distinctSuit || !picked.some(x => g.card(x).suit === g.card(id).suit);
      const swap = req.multi.distinctSuit ? (id, picked) => { const x = picked.find(y => g.card(y).suit === g.card(id).suit); return x == null ? null : x; } : null;
      return { kind: k, cards: NONE, targets: NONE, buttons: { items: req.options, filter, swap, min: n, max: n }, ok: () => u.btn.length === n, answer: () => u.btn.slice(), cancel: !!req.optional };
    }
    if (k === 'pick') return one(req.options, () => u.btn[0]);
    if (k === 'chooseOption') return one(req.options.map((_, i) => i), () => u.btn[0]);
    if (k === 'chooseSkillOrder') return one(req.options.slice(), () => u.btn[0]);
    if (k === 'chooseHero') return one(req.options.slice(), () => ({ pick: u.btn[0] }));
    return null;
  }
  function strikeTargets(t) {
    const req = t.ui.req, g = t.g;
    return { targets: req.options.length > 1 ? { min: 1, max: 1, keep: true, filter: p => req.options.includes(p.seat) } : NONE };
  }

  // ── 统一重算：可选牌 / 可选角色 / 确定按钮
  function refresh(t) {
    const u = t.ui; if (!u) return null;
    const m = modeOf(t);
    const v = { mode: m, cards: new Set(), seats: new Set(), buttons: new Set(), ok: false, selecting: false, targeting: false };
    u.btn = u.btn || [];
    if (m && m.buttons) {
      const br = m.buttons;
      u.btn = u.btn.filter(x => br.items.includes(x));
      for (const it of br.items) {
        if (u.btn.includes(it)) { v.buttons.add(it); continue; }
        if (br.swap && br.swap(it, u.btn) != null) { v.buttons.add(it); continue; }   // 可以和已选的同类牌互换（如雕琢同花色换一张）
        if (u.btn.length >= br.max && br.max > 1) continue;
        if (br.filter(it, u.btn)) v.buttons.add(it);
      }
      v.ok = u.btn.length >= br.min && u.btn.length <= br.max && (!m.ok || !!m.ok());
      u.view = v; return v;
    }
    if (m) {
      const cr = rng(m.cards);
      if (cr.max > 0) {
        v.selecting = true;
        const full = u.sel.length >= cr.max;
        for (const c of cr.pool()) {
          if (u.sel.includes(c)) { v.cards.add(c.id); continue; }
          if (full && cr.max > 1) continue;
          if (cr.filter(c, u.sel)) v.cards.add(c.id);
        }
        // 已选但已不合法的牌（例如技能切换后）剔除
        const okSel = u.sel.filter(c => cr.pool().includes(c) && (cr.filter(c, []) || cr.filter(c, u.sel)));
        if (okSel.length !== u.sel.length) { u.sel = okSel; return refresh(t); }
      }
      const tr = rng(m.targets);
      if (tr.max > 0) {
        v.targeting = true;
        // 已选目标逐个复核（前面的目标变了，后面的可能失效）
        const kept = [];
        for (const p of u.targets) { if (kept.length < tr.max && !p.dead && tr.filter(p, kept)) kept.push(p); else break; }
        if (kept.length !== u.targets.length) u.targets = kept;
        // 场上只剩两人时，只有一个合法目标就直接替玩家选好（杀、探囊取物等），不用再点一次
        if (!u.targets.length && (tr.min || 0) >= 1 && t.g.players.filter(p => !p.dead).length === 2) { const cand = t.g.players.filter(p => !p.dead && tr.filter(p, [])); if (cand.length === 1) u.targets = [cand[0]]; }
        for (const p of t.g.players) {
          if (u.targets.includes(p)) { v.seats.add(p.seat); continue; }
          if (p.dead) continue;
          if (u.targets.length >= tr.max && tr.max > 1) continue;
          if (tr.filter(p, u.targets)) v.seats.add(p.seat);
        }
      } else if (u.targets.length) u.targets = [];
      v.ok = u.sel.length >= (cr.min || 0) && u.sel.length <= cr.max &&
             u.targets.length >= (tr.min || 0) && u.targets.length <= tr.max && (!m.ok || !!m.ok());
    }
    u.view = v;
    return v;
  }

  // ── 点击：只改「已选」，再统一重算
  function clickCard(t, c) {
    const u = t.ui; const v = refresh(t); const m = v.mode; if (!m || !v.cards.has(c.id)) return false;
    const cr = rng(m.cards);
    if (u.sel.includes(c)) u.sel = u.sel.filter(x => x !== c);
    else if (cr.max <= 1) u.sel = [c];
    else if (u.sel.length < cr.max) u.sel = u.sel.concat([c]);
    else return false;
    if (!(m.targets && m.targets.keep)) u.targets = [];
    refresh(t); return true;
  }
  function clickSeat(t, p) {
    const u = t.ui; const v = refresh(t); const m = v.mode; if (!m || !v.seats.has(p.seat)) return false;
    const tr = rng(m.targets);
    const i = u.targets.indexOf(p);
    if (i >= 0) u.targets = u.targets.slice(0, i);
    else if (tr.max <= 1) u.targets = [p];
    else if (u.targets.length < tr.max) u.targets = u.targets.concat([p]);
    else return false;
    refresh(t); return true;
  }
  // 点按钮：返回 'auto' 表示单选已选好、应直接确定
  function clickButton(t, raw) {
    const u = t.ui; const v = refresh(t); const m = v.mode; if (!m || !m.buttons) return false;
    const br = m.buttons; const it = br.items.find(x => String(x) === String(raw)); if (it === undefined || !v.buttons.has(it)) return false;
    const sw = !u.btn.includes(it) && br.swap ? br.swap(it, u.btn) : null;
    if (u.btn.includes(it)) u.btn = u.btn.filter(x => x !== it);
    else if (sw != null) u.btn = u.btn.map(x => x === sw ? it : x);   // 同花色：换掉原来选的那张
    else if (br.max <= 1) u.btn = [it];
    else if (u.btn.length < br.max) u.btn = u.btn.concat([it]);
    else return false;
    const v2 = refresh(t);
    return br.auto && v2.ok ? 'auto' : true;
  }
  function confirm(t) {
    const v = refresh(t); if (!v || !v.ok || !v.mode) return undefined;
    return v.mode.answer();
  }

  root.QXAsk = { modeOf, refresh, clickCard, clickSeat, clickButton, confirm, curCard };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

#qx.qx-full{padding:0;background:#17130d}
#qx.qx-full .qx-top{display:none}
#qx.qx-full .qx-stage{border:none;border-radius:0}
#qx.qx-full .qx-fsx{display:block;position:absolute;left:8px;top:8px;z-index:60;font:inherit;font-size:13px;padding:4px 10px;color:#e9dfc6;background:rgba(20,16,10,.7);border:1px solid #6b5a33;border-radius:6px;cursor:pointer;opacity:.65}
#qx.qx-full .qx-fsx:hover{opacity:1}
/* 技能按钮：四个阵营各自的框（两端装饰固定，中段横向拉伸），左侧是技能性质图标，名字在图标右边的剩余空间里居中；所有按钮同样大小 */
#qx .qx-dsk{left:934px;width:170px;gap:6px}
#qx .qx-skf{position:relative;display:block;flex:none;width:170px;height:36px;padding:0;margin:0;border:0;background:none;font:inherit;cursor:default;filter:brightness(.6) saturate(.5);transition:filter .25s}
#qx .qx-skf::before{content:'';position:absolute;inset:0;background:var(--skimg) 0 0/100% 100% no-repeat}   /* 按钮尺寸固定：框是预先按这个尺寸整张合成好的，没有拼接缝 */
#qx .qx-skf.qx-sklit{filter:none;cursor:pointer}
#qx button.qx-skf.qx-sklit:hover{filter:brightness(1.12)}
#qx .qx-skf.qx-skdone{filter:brightness(.42) saturate(.2)}
#qx .qx-skf.qx-skflash{filter:none;animation:qxskburst 1.6s ease-out}
@keyframes qxskburst{0%{filter:brightness(1.9)}100%{filter:none}}
#qx .qx-skic{position:absolute;top:calc(50% + var(--skpy,0px));left:calc(var(--skcap) + 1px);width:20px;height:20px;margin-top:-10px;background:var(--skc);-webkit-mask:var(--skico) center/contain no-repeat;mask:var(--skico) center/contain no-repeat}
#qx .qx-skn{position:absolute;top:var(--skpy,0px);bottom:calc(-1 * var(--skpy,0px));left:calc(var(--skcap) + 23px);right:calc(var(--skcap) + 1px);display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:visible;color:var(--skc);font:900 15px/1 'Noto Serif SC','Songti SC',serif;letter-spacing:2px}
#qx .qx-skbl{display:inline-block;width:0;height:0;vertical-align:baseline}
#qx.qx-l-en .qx-skn{font:700 11.5px/1 'Cinzel',Georgia,serif;letter-spacing:.4px}
#qx .qx-sksvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 2px #ffe08a) drop-shadow(0 0 4px rgba(255,190,70,.8))}
#qx .qx-sksvg rect{fill:none;stroke:#fff3c4;stroke-linecap:round}
@keyframes qxsksnake{from{stroke-dashoffset:var(--sko)}to{stroke-dashoffset:calc(var(--sko) - 50)}}

/* 武将名竖条：一律白字，细黑描边 */
#qx .qx-snm,#qx .qx-snm.qx-sndk{color:#fff!important;-webkit-text-stroke:7px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 0 10px rgba(0,0,0,.55)}
/* 座位号：所有数字同样高；VII、VIII 这种长的只在横向收窄，不缩小字号 */
#qx .qx-sno svg{width:100%;height:100%;overflow:visible}
#qx .qx-sno text{font:700 78px Georgia,"Times New Roman",serif;fill:#ffe6a8;paint-order:stroke fill;stroke:rgba(0,0,0,.7);stroke-width:6px}
/* 限定技 / 觉醒技标记：立体圆章，彩色=可用（限定技）/已觉醒，黑白=已用 / 未觉醒 */
#qx .qx-skmks{position:absolute;display:flex;flex-direction:column;gap:14px;z-index:7;pointer-events:none}
#qx .qx-skmks.qx-skmo{left:1100px;top:24px}
#qx .qx-skmks.qx-skmme{left:-210px;top:1240px;flex-direction:column-reverse}
#qx .qx-skmk{position:relative;width:196px;height:196px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#6a5640,#2a1e14 62%,#120c07);border:9px solid #d2a84e;box-shadow:inset 0 10px 14px rgba(255,236,190,.35),inset 0 -12px 18px rgba(0,0,0,.65),0 10px 18px rgba(0,0,0,.75);transition:filter .6s}
#qx .qx-skmk::after{content:'';position:absolute;left:14%;top:8%;width:52%;height:34%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.5),rgba(255,255,255,0) 70%);pointer-events:none}
#qx .qx-skmk i{position:absolute;inset:6px;-webkit-mask:var(--skico) center/contain no-repeat;mask:var(--skico) center/contain no-repeat}
#qx .qx-skmk-limited i{background:linear-gradient(315deg,#a8120a 0%,#e0301a 34%,#ff7a1a 58%,#ffd24a 82%,#fff3a0 100%);filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(255,120,40,.65))}
#qx .qx-skmk-awaken i{background:linear-gradient(180deg,#d8fbff 0%,#5fd8ff 38%,#1d8fe8 72%,#0d4fb8 100%);filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(60,200,255,.75))}
#qx .qx-skmk.qx-skmoff{filter:grayscale(1) brightness(.78) contrast(1.05)}
#qx .qx-skmk.qx-skmnow{animation:qxskmpop 1.1s ease-out}
@keyframes qxskmpop{0%{transform:scale(.7);filter:grayscale(1) brightness(2)}45%{transform:scale(1.25);filter:grayscale(0) brightness(1.6)}100%{transform:none;filter:none}}
/* 玩家区：装备区 | 手牌区 | 技能区之间的分隔线（金色细线，两头渐隐，中间一颗菱形） */
#qx .qx-dsep{position:absolute;top:22px;bottom:14px;width:12px;pointer-events:none;z-index:2}
#qx .qx-dsep1{left:212px}
#qx .qx-dsep2{left:calc(920px + var(--qx-ex,0px))}
#qx .qx-dsep::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,rgba(217,180,90,0),rgba(217,180,90,.75) 18%,rgba(255,226,150,.9) 50%,rgba(217,180,90,.75) 82%,rgba(217,180,90,0));box-shadow:0 0 6px rgba(217,180,90,.35)}
#qx .qx-dsep::after{content:'';position:absolute;left:1px;top:50%;width:8px;height:8px;margin-top:-5px;transform:rotate(45deg);background:linear-gradient(135deg,#fff0b8,#c9962f);border:1px solid #5a3e12;box-shadow:0 0 6px rgba(255,210,110,.6)}
/* 正在操作的技能：按钮内部呼吸灯 */
#qx .qx-skf.qx-on::after{content:'';position:absolute;inset:5px 8px;border-radius:13px;background:radial-gradient(ellipse at 50% 50%,rgba(255,242,190,.75),rgba(255,214,120,.25) 55%,rgba(255,214,120,0) 80%);mix-blend-mode:screen;animation:qxskbreath 1.5s ease-in-out infinite;pointer-events:none}
@keyframes qxskbreath{0%,100%{opacity:.15}50%{opacity:.9}}
#qx .qx-skic,#qx .qx-skn{z-index:1}
/* 点将 */
#qx .qx-fpgrid{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;padding:4px 8px}
#qx .qx-fprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#qx .qx-fprow>b{width:100%;font-size:13px;color:#d9b45a;letter-spacing:2px}
#qx .qx-fpk{font:inherit;font-size:14px;padding:5px 10px;border-radius:5px;border:1px solid #6b5a33;background:#2a2318;color:#f1e4c2;cursor:pointer}
#qx .qx-fpk:hover{border-color:#e0b850;background:#3a2f1c}

  function mkey(n) { if (n.nodeType !== 1) return null; const a = n.getAttribute; const k = n.getAttribute('data-hid') || n.getAttribute('data-cid') || n.getAttribute('data-id') || n.getAttribute('data-seat') || n.getAttribute('data-opt') || n.getAttribute('data-arr') || n.getAttribute('data-mk'); return k == null ? null : n.tagName + '|' + (n.className || '').split(' ')[0] + '|' + k; }
  function morphNode(x, y) {

        title = t('order');
        const me = g.p(this.me);
        body = `<div class="qx-mopts">${req.options.map(key => { const s = g.skillList(me).find(x => x.key === key); return `<button class="qx-mopt" data-opt="${key}">${esc(s && s.src === 'equip' ? T.cardName(s.id) : T.skillName(s ? s.id : key))}</button>`; }).join('')}</div>`;
      }
      this.showModal(`<div class="qx-box ${cls}"><div class="qx-mtitle"><i></i><span>${esc(title)}</span><i></i></div>${sub ? `<div class="qx-msub">${esc(sub)}</div>` : ''}<div class="qx-mbody">${body}</div>${foot ? `<div class="qx-mfoot">${foot}</div>` : ''}</div>`);
    }
    // 观星：拖动排序 / 拖到下面一行即放到牌堆底；单击在两行之间切换
    bindArrangeDrag() {
      let d = null;
      const root = this.root;
      root.addEventListener('pointerdown', e => {
        const el = e.target.closest('.qx-modal [data-arr]'); if (!el || e.button !== 0) return;
        d = { id: +el.dataset.arr, el, x0: e.clientX, y0: e.clientY, on: false };
      });
      root.addEventListener('pointermove', e => {
        if (!d) return;
        if (!d.on) { if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return; d.on = true; const r = d.el.getBoundingClientRect(); d.dx = d.x0 - r.left; d.dy = d.y0 - r.top; d.ghost = d.el.cloneNode(true); d.ghost.className = 'qx-aghost'; d.ghost.style.width = r.width + 'px'; root.appendChild(d.ghost); d.el.style.opacity = '.25'; }
        d.ghost.style.left = (e.clientX - d.dx) + 'px'; d.ghost.style.top = (e.clientY - d.dy) + 'px';
        root.querySelectorAll('.qx-aslot.qx-ahover').forEach(x => x.classList.remove('qx-ahover'));
        const tgt = document.elementFromPoint(e.clientX, e.clientY); const sl = tgt && tgt.closest('.qx-aslot'); if (sl) sl.classList.add('qx-ahover');
      });
      const end = e => {
        if (!d) return; const was = d; d = null; const u = this.ui; if (!u || !u.arr) return;
        root.querySelectorAll('.qx-aslot.qx-ahover').forEach(x => x.classList.remove('qx-ahover'));
        const A = u.arr; const from = A.top.includes(was.id) ? 'top' : 'bottom';
        if (was.on) {
          was.ghost.remove(); was.el.style.opacity = '';
          const tgt = document.elementFromPoint(e.clientX, e.clientY); const sl = tgt && tgt.closest('.qx-aslot');
          if (sl) { A[from] = A[from].filter(x => x !== was.id); const row = sl.dataset.row; const idx = Math.min(+sl.dataset.idx, A[row].length); A[row].splice(idx, 0, was.id); }
        } else { A[from] = A[from].filter(x => x !== was.id); A[from === 'top' ? 'bottom' : 'top'].push(was.id); }
        this.arrangeJust = true; setTimeout(() => { this.arrangeJust = false; }, 30);
        this.openChoiceModal();
      };
      root.addEventListener('pointerup', end); root.addEventListener('pointercancel', end);
    }
    heroCardHTML(key, i, refreshed) {
      const T = this.T, t = T.t, h = E.HEROES[key];
      const sk = h.skills.map(id => { const d = E.SKILLS[id] || {}; const tag = { locked: t('lockedTag'), limited: t('limitedTag'), awaken: t('awakenTag'), lord: t('lordTag') }[d.type]; return `<div class="qx-hsk"><b>${esc(T.skillName(id))}</b>${tag ? `<i class="qx-tagi">${esc(tag)}</i>` : ''} ${esc(T.skillDesc(id))}</div>`; }).join('');
      return `<div class="qx-hcard"><div class="qx-hpic" data-zoomhero="${key}"><img src="${this.heroSrc(key)}" alt="${esc(T.heroName(key))}" draggable="false"></div><div><span class="qx-fac" style="background:${T.factionColor(h.faction)}"></span><span class="qx-meta">${esc(T.faction(h.faction))}</span></div>
        <div class="qx-hname">${esc(T.heroName(key))}</div><div class="qx-meta">${esc(T.heroTitle(key))} · ${esc(t('hpN', { n: h.hp }))}</div>${sk}
        <div class="qx-hbtns"><button class="qx-btn qx-primary" data-hero="${key}">${t('pickHero')}</button>${refreshed ? '' : `<button class="qx-btn" data-refresh="${i}">${t('refresh')}</button>`}</div></div>`;
    }
    skillsHTML(p) {
      const T = this.T, t = T.t; if (!this.heroShown(p)) return '';
      return `<div class="qx-skills">${p.skills.map(id => {
        const d = E.SKILLS[id]; if (!d) return '';
        const tag = { locked: t('lockedTag'), limited: t('limitedTag'), awaken: t('awakenTag'), lord: t('lordTag') }[d.type];
        const used = d.type === 'limited' && p.skillState[id];
        return `<span class="qx-sk${used ? ' qx-skused' : ''}" title="${esc((tag ? '[' + tag + '] ' : '') + T.skillDesc(id))}">${esc(T.skillName(id))}</span>`;
      }).join('')}</div>`;
    }
    heroShown(p) { const g = this.g; return !!p.hero && (g.heroesRevealed || !g.opts.selectHeroes || p.role === 'chancellor' || p.seat === this.me); }
    heroLine(p) {
      const T = this.T; if (!this.heroShown(p)) return '';
      return `<span class="qx-fac" style="background:${T.factionColor(p.faction)}"></span><span class="qx-hero">${esc(T.heroName(p.hero))}</span>`;
    }
    asChoices(key) { const me = this.g.p(this.me); const inst = this.g.skillList(me).find(s => s.key === key); return inst && inst.def.viewAs && inst.def.viewAs.choices || null; }
    // 转化成哪种基本牌：独立窗口，此刻不能使用的牌暗着；选一张按确定，或取消
    openAsChoice() {
      const u = this.ui, g = this.g, me = g.p(this.me), T = this.T, t = T.t; const ch = this.asChoices(u.skill); if (!ch) return;
      const ids = u.sel.map(c => c.id);
      const ok = nm => { const vc = g.buildCard(me, { cardIds: ids, skill: u.skill, asName: nm }, null, { phase: true }); return !!vc && g.playable(me, vc); };
      u.ascPick = u.ascPick && ok(u.ascPick) ? u.ascPick : null;
      const cards = ch.map(nm => { const can = ok(nm); return `<div class="qx-ascc${can ? '' : ' qx-ascoff'}${u.ascPick === nm ? ' qx-ascon' : ''}"${can ? ` data-act="ascpick:${nm}"` : ''}>${this.cardHTML({ name: nm, suit: (u.sel[0] || {}).suit || 'none', rank: (u.sel[0] || {}).rank || 0 }, 'qx-mcard')}</div>`; }).join('');
      const inst = g.skillList(me).find(s => s.key === u.skill);
      this.showModal(`<div class="qx-box qx-ascbox"><div class="qx-mtitle"><i></i><span>${esc(T.skillName(inst ? inst.id : u.skill))}</span><i></i></div><div class="qx-msub">${esc(t('ascTip'))}</div><div class="qx-ascrow">${cards}</div><div class="qx-mfoot"><button class="qx-dbt qx-primary" data-act="asc:${u.ascPick || ''}"${u.ascPick ? '' : ' disabled'}>${esc(t('confirm'))}</button><button class="qx-dbt" data-act="asc:-">${esc(t('cancel'))}</button></div></div>`);
    }
    closeModal() { const m = this.$('.qx-modal'); if (m) { m.classList.add('qx-hidden'); m.innerHTML = ''; } }
    showGameOver() {
      const g = this.g, T = this.T, t = T.t; if (!g.result) return;
      const w = g.result.winners; const me = g.p(this.me);
      const head = !w.length ? t('draw') : w.includes(me.role) ? t('youWin') : t('youLose');
      const roles = g.players.map(p => `<div>${this.identityHTML(p)}<span>${esc(T.role(p.role))} · ${p.seat === this.me ? t('you') : t('seat', { n: p.seat + 1 })}${p.hero ? ' · ' + esc(T.heroName(p.hero)) : ''}${p.dead ? ' · ' + t('dead') : ''}</span></div>`).join('');
      const m = this.$('.qx-modal');
      m.innerHTML = `<div class="qx-box"><h3>${t('gameOver')} · ${esc(head)}</h3><div class="qx-meta">${w.length ? esc(t('winners', { w: w.map(T.role).join(this.lang === 'zh' ? '、' : ' & ') })) : ''}</div><div class="qx-roles" style="margin:10px 0">${roles}</div><button class="qx-btn qx-primary" data-act="again">${t('again')}</button></div>`;
      m.classList.remove('qx-hidden');
    }
  }

  Table.all = [];
  return { mount: (el, opts) => new Table(el, opts), Table, FACTIONS };
});

</script>
<script>window.qxTable = QXUI.mount(document.getElementById('qx-host'), Object.fromEntries(new URLSearchParams(location.search)));</script>
